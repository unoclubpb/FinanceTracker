<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102a49"><title>Personal Finance Tracker</title><link rel="stylesheet" href="./styles.css?v=1.02">
<link rel="icon" type="image/png" href="./apple-touch-icon.png?v=2"><link rel="icon" type="image/svg+xml" href="./icon.svg"><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=2"><link rel="manifest" href="./manifest.webmanifest"></head>
<body>
<header><div class="brand"><span class="logo">◈</span><div><strong>PERSONAL FINANCE</strong><small>Tracker</small></div></div></header>
<main>
<section id="auth" class="auth card"><h1>Opening Finance Tracker</h1><p>Your tracker opens automatically. No email sign-in required.</p><p id="authMessage" role="status">Connecting…</p></section>
<section id="app" class="hidden">
<nav id="tabs" aria-label="Main navigation"><button data-tab="dashboard" class="active">Overview</button><button data-tab="accounts">Accounts</button><button data-tab="transactions">Transactions</button><button data-tab="bills">Bills</button><button data-tab="reports">Reports</button></nav>
<div class="topline"><h1 id="pageTitle">Overview</h1><button id="addBtn">+ Add</button></div>
<div id="message" role="status" class="hidden"></div>
<section id="dashboard" class="page"></section>
<section id="accounts" class="page hidden"></section>
<section id="transactions" class="page hidden"></section>
<section id="bills" class="page hidden"></section>
<section id="reports" class="page hidden"></section>
</section></main>
<dialog id="editor"><form id="editForm" method="dialog"><div class="dialogHead"><h2 id="editorTitle">New transaction</h2><button type="button" class="close" id="closeEditor" aria-label="Close">×</button></div><div id="editorFields"></div><div class="actions"><button type="button" class="secondary" id="cancelEditor">Cancel</button><button type="submit" id="saveEditor">Save</button></div></form></dialog>
<footer>Personal Finance Tracker · Version 1.02 · Private financial data in Supabase</footer>
<script type="module" src="./app.js?v=1.02"></script></body></html>
